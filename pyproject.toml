[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-game-analyser"
version = "0.1.0"
description = "Moteur d'échecs en Python pur : règles, parties et analyse"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
chess-game = "chess_engine.main:main"

[tool.setuptools.packages.find]
where = ["src"]
